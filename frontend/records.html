<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Records | Mini Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVBAR (same as index.html, only the "active" link differs) -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">Mini MS</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
              data-bs-target="#mainNav" aria-controls="mainNav"
              aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link active" href="records.html">Records</a></li>
        </ul>
        <a class="btn btn-outline-light btn-sm me-2" href="login.html">Login</a>
        <a class="btn btn-primary btn-sm" href="register.html">Register</a>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <h1>Records</h1><div class="row g-3">

    <!-- [COMP-01] Add Record form -->
    <div class="col-12 col-md-6 col-lg-10">
      <div class="card summary-card shadow-sm">
        <div class="card-body">
    <h2 class="text-muted">Add Records</h2>
    <form id="addForm" class="row g-2" novalidate>
          <div class="col-12 col-md-4">
            <input type="text" id="addName" class="form-control" placeholder="Name" required>
            <div class="invalid-feedback">Enter a name.</div>
          </div>
          <div class="col-12 col-md-4">
            <input type="email" id="addEmail" class="form-control" placeholder="Email" required>
            <div class="invalid-feedback">Enter a valid email.</div>
          </div>
          <div class="col-8 col-md-2">
            <select id="addStatus" class="form-select">
              <option>Active</option>
              <option>Inactive</option>
            </select>
          </div>
          <div class="col-4 col-md-2 d-grid">
            <button type="submit" class="btn btn-primary">Add record</button>
          </div>
        </form>
      </div>
    </div>
       
    

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
